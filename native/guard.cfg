var purifierEnv = Cc['@mozilla.org/process/environment;1'].getService(Ci.nsIEnvironment);
function purifierStatus(value){
 if(!purifierEnv.exists('FIREFOX_PURIFIER_STARTUP'))return;
 const file=Cc['@mozilla.org/file/local;1'].createInstance(Ci.nsIFile);
 file.initWithPath(purifierEnv.get('FIREFOX_PURIFIER_STARTUP'));
 const stream=Cc['@mozilla.org/network/file-output-stream;1'].createInstance(Ci.nsIFileOutputStream);
 stream.init(file,0x02|0x08|0x20,0o600,0);
 const writer=Cc['@mozilla.org/intl/converter-output-stream;1'].createInstance(Ci.nsIConverterOutputStream);
 writer.init(stream,'UTF-8');writer.writeString(JSON.stringify(value));writer.close();
}
function purifierFatal(error){
 purifierStatus({error:String(error)});
 dump('Firefox purifier startup failed: '+String(error)+'\n');
 Cc['@mozilla.org/toolkit/app-startup;1'].getService(Ci.nsIAppStartup).quit(Ci.nsIAppStartup.eForceQuit,1);
 throw error;
}
if(purifierEnv.exists('FIREFOX_PURIFIER_ENVIRONMENT')){try{
 var {AddonManager}=ChromeUtils.importESModule('resource://gre/modules/AddonManager.sys.mjs');
 var {XPIProvider,XPIInternal} = ChromeUtils.importESModule('resource://gre/modules/addons/XPIProvider.sys.mjs');
 var originalSetup = XPIProvider.setupInstallLocations;
 XPIProvider.setupInstallLocations = function(...args){
  try{
  const version=Cc['@mozilla.org/xre/app-info;1'].getService(Ci.nsIXULAppInfo).version;
  if(version!=='159.0')throw new Error('This Firefox provider requires Firefox 159.0');
  const file=Cc['@mozilla.org/file/local;1'].createInstance(Ci.nsIFile);
  file.initWithPath(purifierEnv.get('FIREFOX_PURIFIER_ENVIRONMENT')+'/extensions');
  if(!file.exists()||!file.isDirectory())throw new Error('Locked Firefox extension directory missing');
  const result=originalSetup.apply(this,args);
  const empty=file.parent;empty.append('empty');
  const system=XPIInternal.XPIStates.getLocation('app-system-addons');
  if(system){const installer=system.installer;system._baseDir=empty;system.locked=true;system._installer=installer;}
  const systemProfile=XPIInternal.XPIStates.getLocation('app-system-profile');
  if(systemProfile){systemProfile.dir=empty;systemProfile.path=empty.path;systemProfile.locked=true;systemProfile._installer=undefined;}
  const location=XPIInternal.XPIStates.getLocation('app-profile');
  if(!location)throw new Error('Native Firefox profile extension location missing');
  location.dir=file;location.path=file.path;location.locked=true;location._installer=undefined;
  // Revalidate code with Firefox's original parser instead of profile startup caches.
  XPIInternal.XPIStates.initialStateData=null;
  XPIInternal.XPIStates.loadExtensionState=()=>({});
  const {XPIDatabaseReconcile}=ChromeUtils.importESModule('resource://gre/modules/addons/XPIDatabase.sys.mjs');
  const bundled=XPIDatabaseReconcile.isAppBundledLocation;
  XPIDatabaseReconcile.isAppBundledLocation=function(location){
   return location.name==='app-profile'||bundled.call(this,location);
  };
  const check=XPIProvider.checkForChanges;
  XPIProvider.checkForChanges=function(_changed,...args){return check.call(this,true,...args);};
  purifierStatus({ready:true});
  return result;}catch(error){return purifierFatal(error);}
 };
 const frozen=async()=>{throw new Error('Firefox extensions are locked; run firefox-purifier lock --update');};
 for(const method of ['getInstallForFile','getInstallForURL','installTemporaryAddon','stageLangpacksForAppUpdate','updateSystemAddons'])XPIProvider[method]=frozen;
 XPIProvider.isInstallEnabled=()=>false;
 XPIProvider.isInstallAllowed=()=>false;
 lockPref('extensions.systemAddonSet',JSON.stringify({schema:1,addons:{}}));
 lockPref('extensions.autoDisableScopes',0);
 lockPref('extensions.enabledScopes',AddonManager.SCOPE_PROFILE|AddonManager.SCOPE_APPLICATION);
}catch(error){purifierFatal(error);}}
