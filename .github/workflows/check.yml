name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate without import from derivation
        run: >-
          nix eval --json --option allow-import-from-derivation false
          .#checks --apply
          'all: builtins.mapAttrs (_: checks: builtins.mapAttrs (_: drv: drv.drvPath) checks) all'
      - run: nix flake check -L
      - name: Rebuild native exports, resource views and ordinary consumers
        run: python3 tests/resource-rebuild.py
      - run: nix build .# --out-link result-cli
      - run: nix build .#firefox --out-link result-firefox
      - run: nix build .#gui-test-env --out-link result-test-env
      - run: python3 tests/fallback.py
      - run: python3 tests/dependency-environment.py result-cli
      - run: python3 tests/conformance.py result-cli/bin/firefox-purifier
      - run: result-test-env/bin/python3 tests/native.py result-cli result-firefox result-test-env
      - run: result-test-env/bin/python3 tests/cache.py result-cli result-firefox result-test-env
      - run: result-test-env/bin/python3 tests/temporary.py result-cli result-firefox result-test-env
      - run: FIREFOX_TEST_ID=addon@darkreader.org result-test-env/bin/python3 tests/temporary.py result-cli result-firefox result-test-env
      - run: python3 tests/artifacts.py result-cli
      - run: python3 tests/capture.py result-cli
      - name: Rebuild native extensions, screenshots and release
        run: |
          purifier_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --rebuild --no-link \
            ".#checks.$purifier_system.sdk" \
            ".#checks.$purifier_system.environment" \
            ".#checks.$purifier_system.project" \
            ".#checks.$purifier_system.release"
